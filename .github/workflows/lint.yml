name: lint

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5 # v3
      - uses: actions/setup-python@7f4fc3e # v4
        with:
          python-version-file: '.python-version-ci'
      - uses: py-actions/flake8@84ec672 # v2
        with:
          path: 'src tests'
