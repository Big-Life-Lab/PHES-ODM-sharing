name: test

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744ff2bd294095638e18286ca9a3d1956744 # v3

    - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c22c37d6ff65e88745f38bd3157c663f7c22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version-file: '.python-version-ci'

    - name: cache dependencies
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: install dependencies
      run: pip install -r requirements.txt
      if: steps.cache-pip.outputs.cache-hit != 'true'

    - run: pip install .
    - run: ./run-all-tests.sh
