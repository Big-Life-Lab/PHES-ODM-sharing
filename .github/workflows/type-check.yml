name: type-check

on: [pull_request]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5 # v3
      - uses: actions/setup-python@7f4fc3e # v4
        with:
          python-version-file: '.python-version-ci'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy
